services:
  app:
    image: venlinks:local
    network_mode: host
    command: ["node", "/app/web/server.js"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VENLINKS_NODE_IMAGE: ${VENLINKS_NODE_IMAGE:-docker.m.daocloud.io/library/node:22-bookworm-slim}
        VENLINKS_NPM_REGISTRY: ${VENLINKS_NPM_REGISTRY:-https://registry.npmmirror.com}
        VENLINKS_DEBIAN_MIRROR: ${VENLINKS_DEBIAN_MIRROR:-http://mirrors.aliyun.com/debian}
        VENLINKS_DEBIAN_SECURITY_MIRROR: ${VENLINKS_DEBIAN_SECURITY_MIRROR:-http://mirrors.aliyun.com/debian-security}
    env_file:
      - .env
    volumes:
      - venlinks-data:/app/web/.data
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 127.0.0.1
      PORT: ${VENLINKS_HOST_PORT:-3002}
      VENLINKS_DATA_DIR: /app/web/.data
      VENLINKS_INTERNAL_ORIGIN: http://127.0.0.1:${VENLINKS_HOST_PORT:-3002}
      VENLINKS_DATABASE_PROVIDER: postgres
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置 DATABASE_URL}
      VENLINKS_DATABASE_POOL_MAX: ${VENLINKS_DATABASE_POOL_MAX:-10}
      VENLINKS_DATABASE_SSL: "0"
      VENLINKS_ENCRYPTION_KEY: ${VENLINKS_ENCRYPTION_KEY:?请在 .env 中配置 VENLINKS_ENCRYPTION_KEY}
      VENLINKS_MAINTENANCE_TOKEN: ${VENLINKS_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
      VENLINKS_TRUSTED_PROXY_HOPS: ${VENLINKS_TRUSTED_PROXY_HOPS:-1}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${VENLINKS_HOST_PORT:-3002}/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  generation-worker:
    image: venlinks:local
    network_mode: host
    command: ["node", "/app/web/scripts/generation-worker.mjs"]
    env_file:
      - .env
    environment:
      VENLINKS_WORKER_API_ORIGIN: http://127.0.0.1:${VENLINKS_HOST_PORT:-3002}
      VENLINKS_MAINTENANCE_TOKEN: ${VENLINKS_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  venlinks-data:
