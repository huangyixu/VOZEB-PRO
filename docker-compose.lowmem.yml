services:
  app:
    image: ghcr.io/csyqlz/venlinks-pro:latest
    env_file:
      - .env
    ports:
      - "${VENLINKS_PRO_HOST_PORT:-3002}:3000"
    volumes:
      - venlinks-pro-data:/app/web/.data
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
      UV_THREADPOOL_SIZE: "2"
      NEXT_TELEMETRY_DISABLED: "1"
      VENLINKS_PRO_DATA_DIR: /app/web/.data
      VENLINKS_PRO_INTERNAL_ORIGIN: http://127.0.0.1:3000
      VENLINKS_PRO_DATABASE_PROVIDER: postgres
      DATABASE_URL: ${DATABASE_URL:?低内存部署请在 .env 中配置外部 PostgreSQL DATABASE_URL}
      VENLINKS_PRO_DATABASE_POOL_MAX: ${VENLINKS_PRO_DATABASE_POOL_MAX:-5}
      VENLINKS_PRO_DATABASE_SSL: ${VENLINKS_PRO_DATABASE_SSL:-1}
      VENLINKS_PRO_ENCRYPTION_KEY: ${VENLINKS_PRO_ENCRYPTION_KEY:?请在 .env 中配置 VENLINKS_PRO_ENCRYPTION_KEY}
      VENLINKS_PRO_MAINTENANCE_TOKEN: ${VENLINKS_PRO_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
    mem_limit: 512m
    memswap_limit: 768m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  generation-worker:
    image: ghcr.io/csyqlz/venlinks-pro:latest
    command: ["node", "/app/web/scripts/generation-worker.mjs"]
    env_file:
      - .env
    environment:
      NODE_OPTIONS: "--max-old-space-size=64"
      VENLINKS_PRO_WORKER_API_ORIGIN: http://app:3000
      VENLINKS_PRO_MAINTENANCE_TOKEN: ${VENLINKS_PRO_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 96m
    memswap_limit: 128m
    restart: unless-stopped

volumes:
  venlinks-pro-data:
