services:
  - type: web
    name: venlinks
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    healthCheckPath: /api/health/live
    disk:
      name: venlinks-data
      mountPath: /app/web/.data
      sizeGB: 10
    envVars:
      - fromGroup: venlinks-runtime
      - key: PORT
        value: 3000
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: UV_THREADPOOL_SIZE
        value: "2"
      - key: VENLINKS_DATA_DIR
        value: /app/web/.data
      - key: VENLINKS_INTERNAL_ORIGIN
        value: http://127.0.0.1:3000
      - key: VENLINKS_DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: venlinks-postgres
          property: connectionString
      - key: VENLINKS_DATABASE_POOL_MAX
        value: "5"
      - key: VENLINKS_DATABASE_SSL
        value: "1"
      - key: VENLINKS_ENCRYPTION_KEY
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

  - type: worker
    name: venlinks-generation-worker
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    dockerCommand: node /app/web/scripts/generation-worker.mjs
    envVars:
      - fromGroup: venlinks-runtime
      - key: NODE_OPTIONS
        value: --max-old-space-size=128
      - key: VENLINKS_WORKER_API_ORIGIN
        fromService:
          name: venlinks
          type: web
          property: hostport

databases:
  - name: venlinks-postgres
    plan: basic-256mb
    databaseName: venlinks
    user: venlinks

envVarGroups:
  - name: venlinks-runtime
    envVars:
      - key: VENLINKS_MAINTENANCE_TOKEN
        generateValue: true
