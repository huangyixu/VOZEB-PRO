services:
  docs:
    build:
      context: ..
      dockerfile: docs/Dockerfile
      args:
        VENLINKS_NODE_IMAGE: ${VENLINKS_NODE_IMAGE:-docker.m.daocloud.io/library/node:22-bookworm-slim}
