services:
  app:
    image: ${VENLINKS_PRO_IMAGE:-ghcr.io/csyqlz/venlinks-pro:latest}
    container_name: venlinks-pro
    network_mode: host
    env_file:
      - .env
    volumes:
      - venlinks-pro-data:/app/web/.data
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      VENLINKS_PRO_DATA_DIR: /app/web/.data
      VENLINKS_PRO_INTERNAL_ORIGIN: http://127.0.0.1:3000
      VENLINKS_PRO_DATABASE_PROVIDER: postgres
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置 DATABASE_URL}
      VENLINKS_PRO_DATABASE_POOL_MAX: ${VENLINKS_PRO_DATABASE_POOL_MAX:-10}
      VENLINKS_PRO_DATABASE_SSL: ${VENLINKS_PRO_DATABASE_SSL:-0}
      VENLINKS_PRO_ENCRYPTION_KEY: ${VENLINKS_PRO_ENCRYPTION_KEY:?请在 .env 中配置 VENLINKS_PRO_ENCRYPTION_KEY}
      VENLINKS_PRO_MAINTENANCE_TOKEN: ${VENLINKS_PRO_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
      VENLINKS_PRO_TRUSTED_PROXY_HOPS: ${VENLINKS_PRO_TRUSTED_PROXY_HOPS:-1}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  generation-worker:
    image: ${VENLINKS_PRO_IMAGE:-ghcr.io/csyqlz/venlinks-pro:latest}
    container_name: venlinks-pro-generation-worker
    network_mode: host
    command: ["node", "/app/web/scripts/generation-worker.mjs"]
    env_file:
      - .env
    environment:
      VENLINKS_PRO_WORKER_API_ORIGIN: http://127.0.0.1:3000
      VENLINKS_PRO_MAINTENANCE_TOKEN: ${VENLINKS_PRO_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  venlinks-pro-data:
